<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas 🌻</title>
    <style>
        /* --- ESTILOS CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #1a002c 0%, #050014 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #galaxy-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .floating-flower {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            animation: floatUp linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 223, 0, 0.6));
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) translateX(var(--random-x)) rotate(var(--random-rotate));
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.2);
            z-index: 10;
            max-width: 380px;
            width: 90%;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        p {
            color: #ffffff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: #ffd700;
            color: #050014;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Audio de Floricienta (Link público estable) -->
    <audio id="bg-music" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
        <!-- NOTA: He puesto un audio instrumental público de prueba para asegurar que cargue. 
             Puedes cambiar el link de arriba por el enlace directo de tu canción favorita en formato MP3 si lo prefieres -->
    </audio>

    <div id="galaxy-container"></div>

    <div class="card">
        <h1>¡Feliz Día! 🌻</h1>
        <p>Unas flores amarillas virtuales para recordarte lo especial e importante que eres en mi universo. ✨</p>
        <button class="btn" onclick="startExperience()">¡Te quiero! ❤️</button>
    </div>

    <script>
        /* --- LÓGICA JAVASCRIPT --- */
        const container = document.getElementById('galaxy-container');
        const music = document.getElementById('bg-music');
        const flowerTypes = ['🌻', '🌼', '💛', '✨'];

        function createFlower(isBurst = false, xPos = null) {
            const flower = document.createElement('div');
            flower.classList.add('floating-flower');
            flower.innerText = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];

            const size = Math.random() * (2.5 - 0.8) + 0.8; 
            const duration = Math.random() * (7 - 4) + 4; 
            const leftPosition = xPos !== null ? xPos : Math.random() * 100; 
            const randomXOffset = (Math.random() * 200 - 100) + 'px'; 
            const randomRotate = (Math.random() * 360 + 180) + 'deg'; 

            flower.style.left = `${leftPosition}%`;
            flower.style.fontSize = `${size}rem`;
            flower.style.animationDuration = `${duration}s`;
            flower.style.setProperty('--random-x', randomXOffset);
            flower.style.setProperty('--random-rotate', randomRotate);

            if (isBurst) {
                flower.style.animationName = 'floatUp';
                flower.style.bottom = '0px';
            }

            container.appendChild(flower);

            setTimeout(() => { flower.remove(); }, duration * 1000);
        }

        // Inicia el flujo continuo de fondo
        setInterval(() => { createFlower(); }, 300);

        // Al hacer clic, se activa la música y la explosión de flores
        function startExperience() {
            // Reproducir música
            music.play().catch(error => console.log("La reproducción automática fue bloqueada:", error));
            
            // Lluvia masiva de flores
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const randomX = Math.random() * (80 - 20) + 20;
                    createFlower(true, randomX);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
