<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  canvas { touch-action: none; display: block; }
  #flowerScreen { touch-action: manipulation; }

  #flowerScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
    z-index: 100;
    transition: opacity 1.5s ease;
  }
  #flowerScreen.hidden { opacity: 0; pointer-events: none; }

  .sunflower {
    font-size: 180px;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 0;
    filter: drop-shadow(0 0 40px #ffd700) drop-shadow(0 0 80px #ffae00);
    animation: pulse 2s ease-in-out infinite;
    transition: transform .4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sunflower:hover { transform: scale(1.15) rotate(10deg); }
  .sunflower.clicked { animation: explode 1.2s forwards; }

  @keyframes pulse {
    0%,100% { transform: scale(1) rotate(0deg); }
    50%     { transform: scale(1.08) rotate(6deg); }
  }
  @keyframes explode {
    0%   { transform: scale(1) rotate(0); opacity: 1; }
    50%  { transform: scale(2) rotate(180deg); opacity: .8; }
    100% { transform: scale(6) rotate(720deg); opacity: 0; }
  }
  .hint {
    position: absolute; bottom: 60px; width: 100%; text-align: center;
    color: #ffd700; font-size: 20px; letter-spacing: 2px;
    animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }

  #canvas3d {
    position: fixed; inset: 0;
    opacity: 0; transition: opacity 2s ease 0.3s;
  }
  #canvas3d.visible { opacity: 1; }

  #hud {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: #ffd700;
    font-size: 12px;
    letter-spacing: 1px;
    background: rgba(0,0,0,.5);
    padding: 8px 16px;
    border-radius: 30px;
    border: 1px solid rgba(255,215,0,.3);
    z-index: 50;
    opacity: 0;
    transition: opacity 1s ease 2s;
    pointer-events: none;
    text-align: center;
    max-width: 92vw;
  }
  #hud.visible { opacity: 1; }
  @media (max-width: 600px) {
    #hud { font-size: 10px; padding: 6px 12px; bottom: 12px; }
    .sunflower { font-size: 140px; }
    .hint { font-size: 16px; bottom: 40px; }
  }

  #ytPlayer {
    position: fixed;
    width: 1px; height: 1px;
    bottom: -10px; left: -10px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;

let estrellasGrupos = [];

function crearTexturaEstrella(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0,   'rgba(255,255,255,1)');
  grad.addColorStop(0.2, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.45,'rgba(255,255,255,0.35)');
  grad.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = size * 0.045;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(size/2, size*0.08);
  ctx.lineTo(size/2, size*0.92);
  ctx.moveTo(size*0.08, size/2);
  ctx.lineTo(size*0.92, size/2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = size * 0.022;
  ctx.beginPath();
  ctx.moveTo(size*0.22, size*0.22);
  ctx.lineTo(size*0.78, size*0.78);
  ctx.moveTo(size*0.78, size*0.22);
  ctx.lineTo(size*0.22, size*0.78);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function crearEstrellasFondo() {
  const texturaEstrella = crearTexturaEstrella(128);

  crearCapaEstrellas({
    cantidad: 600, radioMin: 900, radioMax: 2000,
    size: 45, textura: texturaEstrella, doradas: false
  });
  crearCapaEstrellas({
    cantidad: 1400, radioMin: 1000, radioMax: 2400,
    size: 28, textura: texturaEstrella, doradas: false
  });
  crearCapaEstrellas({
    cantidad: 400, radioMin: 800, radioMax: 1800,
    size: 50, textura: texturaEstrella, doradas: true
  });
  crearCapaEstrellas({
    cantidad: 3000, radioMin: 1300, radioMax: 2800,
    size: 14, textura: texturaEstrella, doradas: false
  });
}

function crearCapaEstrellas({ cantidad, radioMin, radioMax, size, textura, doradas }) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(cantidad * 3);
  const col = new Float32Array(cantidad * 3);

  for (let i = 0; i < cantidad; i++) {
    const r = radioMin + Math.random() * (radioMax - radioMin);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);

    const v = 0.85 + Math.random() * 0.15;
    if (doradas) {
      col[i*3]   = 1.0 * v;
      col[i*3+1] = 0.88 * v;
      col[i*3+2] = 0.42 * v;
    } else {
      col[i*3]   = v;
      col[i*3+1] = v * 0.98;
      col[i*3+2] = v * 0.93;
    }
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: size,
    map: textura,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: false,
    sizeAttenuation: true
  });

  const points = new THREE.Points(geo, mat);
  points.renderOrder = -1;
  scene.add(points);

  estrellasGrupos.push({
    points, mat,
    fase: Math.random() * Math.PI * 2,
    velParpadeo: 1.2 + Math.random() * 2.2,
    sizeBase: size
  });
}

/* =========================================================

// Girasol realista con pétalos, centro y sombras
function texturaGirasol(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  const numPetalos = 16;
  const radioExterior = size * 0.46;
  const radioInterior = size * 0.17;

  for (let capa = 0; capa < 3; capa++) {
    const offsetAngulo = (capa * Math.PI) / numPetalos;
    const radioExt = radioExterior * (0.85 + capa * 0.075);
    const radioInt = radioInterior;

    for (let i = 0; i < numPetalos; i++) {
      const angulo = (i / numPetalos) * Math.PI * 2 + offsetAngulo;
      const x1 = cx + Math.cos(angulo) * radioInt;
      const y1 = cy + Math.sin(angulo) * radioInt;
      const x2 = cx + Math.cos(angulo) * radioExt;
      const y2 = cy + Math.sin(angulo) * radioExt;

      const grad = ctx.createLinearGradient(x1, y1, x2, y2);
      if (capa === 2) {
        grad.addColorStop(0, '#d68a00');
        grad.addColorStop(0.5, '#ffb300');
        grad.addColorStop(1, '#ffdc4a');
      } else if (capa === 1) {
        grad.addColorStop(0, '#b87400');
        grad.addColorStop(0.5, '#ff9800');
        grad.addColorStop(1, '#ffc233');
      } else {
        grad.addColorStop(0, '#8a5600');
        grad.addColorStop(0.5, '#e08a00');
        grad.addColorStop(1, '#ffb020');
      }

      const ancho = size * 0.055;
      ctx.save();
      ctx.translate(x1, y1);
      ctx.rotate(angulo);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -ancho * 0.5);
      ctx.quadraticCurveTo((x2-x1) * 0.5, -ancho * 0.9, x2-x1, -ancho * 0.25);
      ctx.quadraticCurveTo((x2-x1) * 1.05, 0, x2-x1, ancho * 0.25);
      ctx.quadraticCurveTo((x2-x1) * 0.5, ancho * 0.9, 0, ancho * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(120, 70, 0, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }
  }

  const radioCentro = radioInterior * 1.25;

  const sombraCentro = ctx.createRadialGradient(cx, cy, 0, cx, cy, radioCentro * 1.15);
  sombraCentro.addColorStop(0, 'rgba(0,0,0,0.3)');
  sombraCentro.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sombraCentro;
  ctx.beginPath();
  ctx.arc(cx, cy, radioCentro * 1.15, 0, Math.PI * 2);
  ctx.fill();

  const gradCentro = ctx.createRadialGradient(
    cx - radioCentro * 0.3, cy - radioCentro * 0.3, 0,
    cx, cy, radioCentro
  );
  gradCentro.addColorStop(0, '#6b3a00');
  gradCentro.addColorStop(0.5, '#3d2000');
  gradCentro.addColorStop(1, '#1f0f00');

  ctx.fillStyle = gradCentro;
  ctx.beginPath();
  ctx.arc(cx, cy, radioCentro, 0, Math.PI * 2);
  ctx.fill();

  const numSemillas = 120;
  for (let i = 0; i < numSemillas; i++) {
    const angulo = Math.random() * Math.PI * 2;
    const dist = Math.random() * radioCentro * 0.9;
    const px = cx + Math.cos(angulo) * dist;
    const py = cy + Math.sin(angulo) * dist;
    const sr = size * 0.006 + Math.random() * size * 0.004;
    ctx.fillStyle = Math.random() > 0.5
      ? 'rgba(255, 200, 100, 0.35)'
      : 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.arc(px, py, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  const brillo = ctx.createRadialGradient(
    cx - radioCentro * 0.4, cy - radioCentro * 0.4, 0,
    cx - radioCentro * 0.4, cy - radioCentro * 0.4, radioCentro * 0.8
  );
  brillo.addColorStop(0, 'rgba(255, 220, 150, 0.25)');
  brillo.addColorStop(1, 'rgba(255, 220, 150, 0)');
  ctx.fillStyle = brillo;
  ctx.beginPath();
  ctx.arc(cx, cy, radioCentro, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 16;
  return tex;
}

// Ramo de flores amarillas realista (buchón)
function texturaRamo(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  ctx.save();
  const gradPapel = ctx.createRadialGradient(cx, cy, size*0.2, cx, cy, size*0.48);
  gradPapel.addColorStop(0, 'rgba(240, 230, 200, 0.9)');
  gradPapel.addColorStop(0.7, 'rgba(200, 185, 150, 0.85)');
  gradPapel.addColorStop(1, 'rgba(150, 130, 90, 0)');
  ctx.fillStyle = gradPapel;
  ctx.beginPath();
  const numPuntos = 20;
  for (let i = 0; i <= numPuntos; i++) {
    const ang = (i / numPuntos) * Math.PI * 2;
    const r = size * 0.42 + Math.sin(i * 1.7) * size * 0.04;
    const x = cx + Math.cos(ang) * r;
    const y = cy + Math.sin(ang) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(100, 80, 50, 0.4)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang) * size * 0.12, cy + Math.sin(ang) * size * 0.12);
    ctx.lineTo(cx + Math.cos(ang) * size * 0.42, cy + Math.sin(ang) * size * 0.42);
    ctx.stroke();
  }
  ctx.restore();

  const flores = [
    { x: 0.5, y: 0.35, r: 0.11, color: 'girasol' },
    { x: 0.33, y: 0.45, r: 0.09, color: 'blanca' },
    { x: 0.67, y: 0.42, r: 0.095, color: 'girasol' },
    { x: 0.42, y: 0.28, r: 0.08, color: 'blanca' },
    { x: 0.58, y: 0.30, r: 0.085, color: 'girasol' },
    { x: 0.5, y: 0.5, r: 0.1, color: 'girasol' },
    { x: 0.30, y: 0.32, r: 0.07, color: 'blanca' },
    { x: 0.70, y: 0.55, r: 0.08, color: 'blanca' },
    { x: 0.28, y: 0.55, r: 0.075, color: 'girasol' },
    { x: 0.72, y: 0.30, r: 0.07, color: 'girasol' }
  ];

  flores.forEach(f => {
    const fx = f.x * size;
    const fy = f.y * size;
    const fr = f.r * size;

    if (f.color === 'girasol') {
      const numPet = 10;
      for (let i = 0; i < numPet; i++) {
        const ang = (i / numPet) * Math.PI * 2;
        const px = fx + Math.cos(ang) * fr * 0.5;
        const py = fy + Math.sin(ang) * fr * 0.5;
        const pxFin = fx + Math.cos(ang) * fr * 1.05;
        const pyFin = fy + Math.sin(ang) * fr * 1.05;
        const grad = ctx.createLinearGradient(px, py, pxFin, pyFin);
        grad.addColorStop(0, '#ffb300');
        grad.addColorStop(1, '#ffdc4a');
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang);
        ctx.fillStyle = grad;
        ctx.beginPath();
        const largo = fr * 0.6;
        const ancho = fr * 0.22;
        ctx.moveTo(0, -ancho);
        ctx.quadraticCurveTo(largo * 0.5, -ancho * 1.3, largo, 0);
        ctx.quadraticCurveTo(largo * 0.5, ancho * 1.3, 0, ancho);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(150, 90, 0, 0.4)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.restore();
      }
      const gc = ctx.createRadialGradient(fx - fr*0.15, fy - fr*0.15, 0, fx, fy, fr * 0.4);
      gc.addColorStop(0, '#6b3a00');
      gc.addColorStop(1, '#1f0f00');
      ctx.fillStyle = gc;
      ctx.beginPath();
      ctx.arc(fx, fy, fr * 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const numPet = 8;
      for (let i = 0; i < numPet; i++) {
        const ang = (i / numPet) * Math.PI * 2;
        const px = fx + Math.cos(ang) * fr * 0.5;
        const py = fy + Math.sin(ang) * fr * 0.5;
        const pxFin = fx + Math.cos(ang) * fr * 1.0;
        const pyFin = fy + Math.sin(ang) * fr * 1.0;
        const grad = ctx.createLinearGradient(px, py, pxFin, pyFin);
        grad.addColorStop(0, '#e8e8e0');
        grad.addColorStop(1, '#ffffff');
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(ang);
        ctx.fillStyle = grad;
        ctx.beginPath();
        const largo = fr * 0.55;
        const ancho = fr * 0.20;
        ctx.moveTo(0, -ancho);
        ctx.quadraticCurveTo(largo * 0.5, -ancho * 1.3, largo, 0);
        ctx.quadraticCurveTo(largo * 0.5, ancho * 1.3, 0, ancho);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(180, 180, 160, 0.5)';
        ctx.lineWidth = 0.7;
        ctx.stroke();
        ctx.restore();
      }
      const gc = ctx.createRadialGradient(fx - fr*0.1, fy - fr*0.1, 0, fx, fy, fr * 0.32);
      gc.addColorStop(0, '#ffeb70');
      gc.addColorStop(1, '#e0a800');
      ctx.fillStyle = gc;
      ctx.beginPath();
      ctx.arc(fx, fy, fr * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  ctx.save();
  for (let i = 0; i < 5; i++) {
    const ang = (i / 5) * Math.PI * 2 + 0.3;
    const hx = cx + Math.cos(ang) * size * 0.38;
    const hy = cy + Math.sin(ang) * size * 0.38;
    const grad = ctx.createLinearGradient(hx, hy, cx, cy);
    grad.addColorStop(0, '#7ab648');
    grad.addColorStop(1, '#3d6b1f');
    ctx.fillStyle = grad;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang + Math.PI);
    ctx.beginPath();
    ctx.ellipse(size * 0.08, 0, size * 0.08, size * 0.025, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 16;
  return tex;
}

// Flor amarilla pequeña
function texturaFlorAmarilla(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  const numPet = 8;
  for (let i = 0; i < numPet; i++) {
    const ang = (i / numPet) * Math.PI * 2;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.45);
    grad.addColorStop(0, '#ffdc4a');
    grad.addColorStop(0.6, '#ffb300');
    grad.addColorStop(1, '#d68a00');
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(size * 0.28, 0, size * 0.28, size * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150, 90, 0, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  const gc = ctx.createRadialGradient(cx - 10, cy - 10, 0, cx, cy, size * 0.15);
  gc.addColorStop(0, '#7a4400');
  gc.addColorStop(1, '#2a1500');
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.15, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * size * 0.13;
    const px = cx + Math.cos(a) * d;
    const py = cy + Math.sin(a) * d;
    ctx.fillStyle = 'rgba(255, 200, 100, 0.4)';
    ctx.beginPath();
    ctx.arc(px, py, size * 0.008, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 16;
  return tex;
}

/* ---------- Textura de mensajes ---------- */
function texturaMensaje(texto, size = 1024) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size / 4;
  const ctx = c.getContext('2d');
  ctx.font = `bold ${size * 0.075}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const pad = 25;
  const w = ctx.measureText(texto).width + pad * 2;
  const h = size * 0.14;
  const x = (c.width - w) / 2;
  const y = (c.height - h) / 2;

  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, 'rgba(255, 230, 130, 0.22)');
  grad.addColorStop(1, 'rgba(255, 180, 40, 0.15)');
  ctx.fillStyle = grad;
  ctx.strokeStyle = 'rgba(255, 220, 100, 0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, h/2);
  else ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.stroke();

  ctx.shadowColor = '#ffae00';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#fff5c0';
  ctx.fillText(texto, c.width/2, c.height/2);

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  tex.anisotropy = 16;
  return tex;
}

/* =========================================================
   🌍 MUNDO ESFÉRICO CON FLORES REALISTAS
   ========================================================= */
const RADIO_MUNDO = 300;
const CAPA_FLORES  = 320;

let mundo;
let floresEsfera = [];

function crearMundoEsfera() {
  const geo = new THREE.SphereGeometry(RADIO_MUNDO, 96, 96);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffb300,
    emissive: 0xff9500,
    emissiveIntensity: 0.35,
    roughness: 0.7,
    metalness: 0.15
  });
  mundo = new THREE.Mesh(geo, mat);
  scene.add(mundo);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(RADIO_MUNDO * 1.18, 48, 48),
    new THREE.MeshBasicMaterial({
      color: 0xffd700,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide
    })
  );
  mundo.add(halo);

  const texGirasol = texturaGirasol(512);
  const texRamo    = texturaRamo(512);
  const texFlor    = texturaFlorAmarilla(256);

  // Distribución: 40% girasoles, 40% ramos, 20% flores amarillas
  const tipos = [];
  for (let i = 0; i < 60; i++) tipos.push('girasol');
  for (let i = 0; i < 60; i++) tipos.push('ramo');
  for (let i = 0; i < 30; i++) tipos.push('flor');

  // Mezclar aleatoriamente
  for (let i = tipos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tipos[i], tipos[j]] = [tipos[j], tipos[i]];
  }

  const CANTIDAD_RAMOS = tipos.length;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < CANTIDAD_RAMOS; i++) {
    const y = 1 - (i / (CANTIDAD_RAMOS - 1)) * 2;
    const radioEnY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;

    const x = Math.cos(theta) * radioEnY;
    const z = Math.sin(theta) * radioEnY;

    const tipo = tipos[i];
    let tex, tam;

    if (tipo === 'girasol') {
      tex = texGirasol;
      tam = 90 + Math.random() * 30;
    } else if (tipo === 'ramo') {
      tex = texRamo;
      tam = 110 + Math.random() * 40;
    } else {
      tex = texFlor;
      tam = 60 + Math.random() * 20;
    }

    const matSprite = new THREE.SpriteMaterial({
      map: tex, transparent: true, depthWrite: false, depthTest: true
    });
    const sprite = new THREE.Sprite(matSprite);

    const pos = new THREE.Vector3(x, y, z).multiplyScalar(CAPA_FLORES);
    sprite.position.copy(pos);
    sprite.scale.set(tam, tam, 1);

    floresEsfera.push({
      sprite, basePos: pos.clone(),
      fase: Math.random() * Math.PI * 2,
      tamBase: tam
    });

    mundo.add(sprite);
  }

  const texCentral = texturaMensaje("Te amo Lucero Mi Mocosa 💛", 1024);
  const matCentral = new THREE.SpriteMaterial({
    map: texCentral, transparent: true, depthTest: false
  });
  const spriteCentral = new THREE.Sprite(matCentral);
  spriteCentral.scale.set(420, 105, 1);
  spriteCentral.renderOrder = 999;
  mundo.add(spriteCentral);
}

/* =========================================================
   💬 MENSAJES ORBITANDO
   ========================================================= */
let mensajesSprites = [];

function crearMensajes() {
  const RADIO_ORBITA = 900;
  mensajes.forEach((texto, i) => {
    const tex = texturaMensaje(texto, 1024);
    const mat = new THREE.SpriteMaterial({
      map: tex, transparent: true, depthWrite: false
    });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(320, 80, 1);

    const angulo = (i / mensajes.length) * Math.PI * 2;
    const radio  = RADIO_ORBITA + (i % 4) * 80;
    const altura = (i % 6 - 3) * 130;
    const velocidad = 0.08 + Math.random() * 0.05;
    const fase = Math.random() * Math.PI * 2;

    mensajesSprites.push({ sprite, angulo, radio, altura, velocidad, fase });
    scene.add(sprite);
  });
}

/* =========================================================
   🖱️ INTERACCIÓN: ratón + táctil
   ========================================================= */
let rotX = 0, rotY = 0;
let targetRotY = 0, targetRotX = 0;
let camDist = 1100, targetCamDist = 1100;
let dragging = false, lastX = 0, lastY = 0;
let pinchStartDist = 0, pinchStartCamDist = 1100;
let lastTap = 0;

// --- Ratón ---
canvas.addEventListener('mousedown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  document.body.classList.add('dragging');
});
window.addEventListener('mouseup', () => {
  dragging = false;
  document.body.classList.remove('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  targetRotY += dx * 0.4;
  targetRotX += dy * 0.4;
  targetRotX = Math.max(-75, Math.min(75, targetRotX));
  lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetCamDist += e.deltaY * 1.0;
  targetCamDist = Math.max(500, Math.min(2200, targetCamDist));
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  targetRotX = 0; targetRotY = 0; targetCamDist = 1100;
});

// --- Táctil ---
function distanciaTactil(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.hypot(dx, dy);
}

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

    const now = Date.now();
    if (now - lastTap < 300) {
      targetRotX = 0; targetRotY = 0; targetCamDist = 1100;
    }
    lastTap = now;

  } else if (e.touches.length === 2) {
    dragging = false;
    pinchStartDist = distanciaTactil(e.touches[0], e.touches[1]);
    pinchStartCamDist = targetCamDist;
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();

  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    targetRotY += dx * 0.5;
    targetRotX += dy * 0.5;
    targetRotX = Math.max(-75, Math.min(75, targetRotX));
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

  } else if (e.touches.length === 2) {
    const d = distanciaTactil(e.touches[0], e.touches[1]);
    const factor = pinchStartDist / d;
    targetCamDist = Math.max(500, Math.min(2200, pinchStartCamDist * factor));
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  dragging = false;
  pinchStartDist = 0;
}, { passive: true });

// Bloquear scroll/zoom del navegador sobre el canvas
document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

/* =========================================================
   🎬 ANIMACIÓN
   ========================================================= */
const clock = new THREE.Clock();
let inicializado = false;

function animar() {
  if (!inicializado) return;
  const t = clock.getElapsedTime();

  targetRotY += 0.12;

  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;
  camDist += (targetCamDist - camDist) * 0.08;

  const radY = rotY * Math.PI / 180;
  const radX = rotX * Math.PI / 180;
  camera.position.set(
    Math.sin(radY) * Math.cos(radX) * camDist,
    Math.sin(radX) * camDist,
    Math.cos(radY) * Math.cos(radX) * camDist
  );
  camera.lookAt(0, 0, 0);

  if (mundo) mundo.rotation.y += 0.0025;

  // ⭐ Parpadeo de estrellas (cada capa con su propio ritmo)
  estrellasGrupos.forEach(g => {
    const p = 0.55 + 0.45 * Math.sin(t * g.velParpadeo + g.fase);
    g.mat.opacity = p;
    g.mat.size = g.sizeBase * (1 + Math.sin(t * g.velParpadeo + g.fase) * 0.06);
  });

  // Flores con bob
  floresEsfera.forEach(f => {
    const bob = Math.sin(t * 2 + f.fase) * 0.06;
    f.sprite.position.copy(f.basePos).multiplyScalar(1 + bob);
    const s = f.tamBase * (1 + Math.sin(t * 3 + f.fase) * 0.08);
    f.sprite.scale.set(s, s, 1);
  });

  // Mensajes orbitando
  mensajesSprites.forEach(o => {
    const a = o.angulo + t * o.velocidad;
    const x = Math.cos(a) * o.radio;
    const z = Math.sin(a) * o.radio;
    const y = o.altura + Math.sin(t * 1.2 + o.fase) * 25;
    o.sprite.position.set(x, y, z);

    const depth = z / o.radio;
    const scaleFactor = 0.7 + (depth + 1) * 0.15;
    o.sprite.scale.set(320 * scaleFactor, 80 * scaleFactor, 1);

    const op = 0.35 + (depth + 1) * 0.35;
    o.sprite.material.opacity = Math.max(0.15, Math.min(1, op));
  });

  renderer.render(scene, camera);
  requestAnimationFrame(animar);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   🎵 YOUTUBE + INICIO
   ========================================================= */

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('ytPlayer', {

    playerVars: {
      autoplay: 0, controls: 0, loop: 1,
      playlist: YOUTUBE_VIDEO_ID,
      modestbranding: 1, rel: 0,
      playsinline: 1,
      origin: window.location.origin
    },
    events: {
      onReady: () => {
        player.setVolume(80);
        try { player.unMute(); } catch(e) {}
      }
    }
  });
};

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

const sunflower = document.getElementById('sunflower');
const flowerScreen = document.getElementById('flowerScreen');
const hud = document.getElementById('hud');

let yaIniciado = false;

function iniciarExperiencia(e) {
  if (yaIniciado) return;
  yaIniciado = true;

  // 🔥 Reproducir INMEDIATAMENTE dentro del gesto (clave en móvil)
  if (player && player.playVideo) {
    try {
      player.setVolume(80);
      player.unMute();
      player.playVideo();
    } catch (err) { console.warn('Audio:', err); }
  }

  sunflower.classList.add('clicked');

  setTimeout(() => {
    flowerScreen.classList.add('hidden');
    canvas.classList.add('visible');
    hud.classList.add('visible');

    crearEstrellasFondo();
    crearMundoEsfera();
    crearMensajes();

    inicializado = true;
    animar();
  }, 900);
}

sunflower.addEventListener('click', iniciarExperiencia);
sunflower.addEventListener('touchend', (e) => {
  e.preventDefault();
  iniciarExperiencia(e);
}, { passive: false });

flowerScreen.addEventListener('click', (e) => {
  if (e.target === flowerScreen) iniciarExperiencia(e);
});
flowerScreen.addEventListener('touchend', (e) => {
  if (e.target === flowerScreen) {
    e.preventDefault();
    iniciarExperiencia(e);
  }
}, { passive: false });
</script>
