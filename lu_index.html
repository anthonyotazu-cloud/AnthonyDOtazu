<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Mocosa Lucero 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Título superior fijo */
        .title-top {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }
        .title-top h1 {
            color: #ffd700;
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            font-weight: bold;
        }
        /* Mensaje Central en el corazón de la galaxia */
        .center-message {
            position: absolute;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 50px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            animation: pulse 2s infinite alternate;
        }
        .center-message h2 {
            color: #ffd700;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        /* Botón discreto para activar música */
        .music-btn {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,215,0,0.3);
        }
    </style>
</head>
<body>

    <div class="title-top">
        <h1>Feliz día de las Flores Amarillas 🌻</h1>
    </div>

    <div class="center-message">
        <h2>Te quiero Lucero ❤️</h2>
    </div>

    <button class="music-btn" onclick="toggleMusic()">🎵 Activar Música</button>

    <audio id="bg-music" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        const music = document.getElementById('bg-music');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleMusic() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }

        // Elementos que orbitarán en la galaxia
        const phrases = ["Flores para ti", "Mi flor favorita", "Sonríe siempre", "Siempre brillas", "Solo para ti", "Eres Luz", "Un detalle amarillo"];
        const flowers = ["🌻", "🌼", "✨"];
        
        const particles = [];
        const numParticles = 120; // Cantidad de elementos en el anillo

        // Crear partículas distribuidas en forma de disco/anillo 3D inclinado
        for (let i = 0; i < numParticles; i++) {
            const isPhrase = Math.random() > 0.4;
            const text = isPhrase 
                ? phrases[Math.floor(Math.random() * phrases.length)] 
                : flowers[Math.floor(Math.random() * flowers.length)];

            particles.push({
                text: text,
                isPhrase: isPhrase,
                angle: Math.random() * Math.PI * 2, // Posición en el círculo
                radius: Math.random() * (window.innerWidth * 0.25 - window.innerWidth * 0.12) + window.innerWidth * 0.12, // Radio del anillo
                speed: Math.random() * (0.008 - 0.003) + 0.003, // Velocidad de giro
                yOffset: Math.random() * 40 - 20, // Dispersión vertical para dar grosor
                fontSize: isPhrase ? Math.random() * (16 - 11) + 11 : Math.random() * (24 - 16) + 16
            });
        }

        // Fondo de estrellas estáticas
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar estrellas de fondo
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // 2. Ordenar partículas por "profundidad" (eje Z simulado) para que las de atrás se pinten primero
            particles.sort((a, b) => Math.sin(a.angle) - Math.sin(b.angle));

            // 3. Dibujar partículas de la galaxia
            particles.forEach(p => {
                p.angle += p.speed; // Hacer que gire

                // Proyección de perspectiva 3D simulada
                const cos = Math.cos(p.angle);
                const sin = Math.sin(p.angle);

                // Inclinación del anillo (multiplicamos la Y por 0.35 para aplastar el círculo y simular el disco de la imagen)
                const x = centerX + cos * p.radius;
                const y = centerY + sin * p.radius * 0.35 + p.yOffset;

                // Escala según la profundidad (más grande al frente, más pequeño al fondo)
                const scale = (sin + 2) / 3; 
                const alpha = (sin + 1) / 2 * 0.8 + 0.2; // Transparencia según distancia

                ctx.save();
                ctx.globalAlpha = alpha;
                
                if (p.isPhrase) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = `bold ${p.fontSize * scale}px sans-serif`;
                    ctx.shadowColor = "#ffaa00";
                    ctx.shadowBlur = 8;
                    ctx.fillText(p.text, x, y);
                } else {
                    ctx.font = `${p.fontSize * scale}px sans-serif`;
                    ctx.fillText(p.text, x, y);
                }
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
