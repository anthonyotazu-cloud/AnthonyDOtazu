<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🌻 Te amo Lucero Mi Mocosa 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }

  /* ==== PANTALLA DE LA FLOR INICIAL ==== */
  #flowerScreen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
    z-index: 100;
    transition: opacity 1.5s ease;
  }
  #flowerScreen.hidden { opacity: 0; pointer-events: none; }

  .sunflower {
    font-size: 180px;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 0 40px #ffd700) drop-shadow(0 0 80px #ffae00);
    animation: pulse 2s ease-in-out infinite;
    transition: transform .4s ease;
  }
  .sunflower:hover { transform: scale(1.15) rotate(10deg); }
  .sunflower.clicked { animation: explode 1.2s forwards; }

  @keyframes pulse {
    0%,100% { transform: scale(1) rotate(0deg); }
    50%     { transform: scale(1.08) rotate(6deg); }
  }
  @keyframes explode {
    0%   { transform: scale(1) rotate(0); opacity: 1; }
    50%  { transform: scale(2) rotate(180deg); opacity: .8; }
    100% { transform: scale(6) rotate(720deg); opacity: 0; }
  }
  .hint {
    position: absolute; bottom: 60px; width: 100%; text-align: center;
    color: #ffd700; font-size: 20px; letter-spacing: 2px;
    animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* ==== ESCENA 3D ==== */
  #scene {
    position: fixed; inset: 0;
    perspective: 1400px;
    opacity: 0; transition: opacity 2s ease 0.5s;
  }
  #scene.visible { opacity: 1; }

  #universe {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
  }

  /* Estrellas de fondo */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: .2; transform: scale(.6); }
    to   { opacity: 1;  transform: scale(1.2); }
  }

  /* Mundo central */
  .world {
    position: absolute;
    width: 320px; height: 320px;
    left: -160px; top: -160px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe680, #ffb300 60%, #c47b00);
    box-shadow:
      0 0 60px #ffd700,
      0 0 140px #ffae00,
      inset -20px -20px 60px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
    animation: rotateWorld 20s linear infinite;
  }
  @keyframes rotateWorld {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }
  .world-text {
    font-size: 34px;
    font-weight: 800;
    color: #4a2500;
    text-shadow: 0 2px 4px rgba(255,255,255,.6);
    text-align: center;
    padding: 20px;
    animation: counterRotate 20s linear infinite;
  }
  @keyframes counterRotate {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(-360deg); }
  }

  /* Ramos de flores amarillas en órbita */
  .bouquet {
    position: absolute;
    font-size: 46px;
    left: -23px; top: -23px;
    filter: drop-shadow(0 0 12px #ffd700);
    animation: bob 4s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes bob {
    0%,100% { margin-top: 0; }
    50%     { margin-top: -14px; }
  }

  /* Mensajes flotantes */
  .msg {
    position: absolute;
    color: #ffe680;
    font-size: 16px;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(255, 215, 0, .08);
    border: 1px solid rgba(255, 215, 0, .35);
    text-shadow: 0 0 10px #ffae00;
    animation: float 6s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes float {
    0%,100% { margin-top: 0; opacity: .85; }
    50%     { margin-top: -18px; opacity: 1; }
  }

  /* Instrucciones */
  #hud {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: #ffd700;
    font-size: 14px;
    letter-spacing: 1px;
    background: rgba(0,0,0,.5);
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255,215,0,.3);
    z-index: 50;
    opacity: 0;
    transition: opacity 1s ease 2s;
    pointer-events: none;
    text-align: center;
  }
  #scene.visible ~ #hud { opacity: 1; }

  /* Reproductor oculto */
  #ytPlayer {
    position: fixed;
    width: 1px; height: 1px;
    bottom: -10px; left: -10px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>

<!-- Pantalla inicial con el girasol -->
<div id="flowerScreen">
  <div class="sunflower" id="sunflower">🌻</div>
  <div class="hint">✨ Toca la flor ✨</div>
</div>

<!-- Escena 3D de la galaxia -->
<div id="scene">
  <div id="universe">
    <!-- El mundo central -->
    <div class="world">
      <div class="world-text">Te amo<br>Lucero 💛</div>
    </div>
    <!-- Los ramos y mensajes se generan por JS -->
  </div>
</div>

<div id="hud">🖱️ Arrastra para girar &nbsp;|&nbsp; 🔍 Rueda para zoom &nbsp;|&nbsp; 👆 Doble clic para restablecer</div>

<!-- Reproductor de YouTube oculto -->
<div id="ytPlayer"></div>

<script>
/* =========================================================
   1. CONFIGURACIÓN
   ========================================================= */
// 👉 REEMPLAZA ESTE ID por el de la canción de Floricienta que quieras
//    Ejemplo: https://www.youtube.com/watch?v=ABC123  ->  ID = "ABC123"
const YOUTUBE_VIDEO_ID = "S7gMzYqXIZc"; // ← cámbialo por la canción real

/* =========================================================
   2. DATOS: MENSAJES Y RAMOS
   ========================================================= */
const mensajes = [
  "Te amo Lucero 💛",
  "Eres mi sol 🌻",
  "Mi flor favorita 🌼",
  "Contigo todo brilla ✨",
  "Eres mi universo 🌌",
  "Te elijo siempre 💫",
  "Mi persona favorita 🥰",
  "Eres mi mocosa 🏡",
  "Brillas más que las estrellas ⭐",
  "Gracias por existir 🌻",
  "Eres mi sueño cumplido 💛",
  "Cada día te quiero más 💖",
  "Mi girasol hermoso 🌻",
  "Eres mi Dramatica 🎭",
  "Te amo infinito ♾️",
  "Mi corazón es tuyo ❤️",
  "Eres mi canción favorita 🎵",
  "Feliz día, mi amor 🌞"
];

const ramos = ["💐","🌻","🌼","🌷","🌸","💐","🌻","🌼","🌷","🌸","💐","🌻"];

/* =========================================================
   3. CREAR LA GALAXIA
   ========================================================= */
const universe = document.getElementById('universe');
const scene    = document.getElementById('scene');

// --- Estrellas de fondo ---
function crearEstrellas() {
  const n = 260;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.width  = size + 'px';
    s.style.height = size + 'px';
    s.style.left   = Math.random() * window.innerWidth + 'px';
    s.style.top    = Math.random() * window.innerHeight + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    document.getElementById('scene').appendChild(s);
  }
}

// --- Ramos de flores en órbita ---
let orbitaRamos = [];
function crearRamos() {
  const radioBase = 420;
  ramos.forEach((emoji, i) => {
    const el = document.createElement('div');
    el.className = 'bouquet';
    el.textContent = emoji;

    const angulo = (i / ramos.length) * Math.PI * 2;
    const radio  = radioBase + (i % 3) * 70;
    const altura = (i % 5 - 2) * 90;
    const velocidad = 0.08 + Math.random() * 0.05;
    const offset = Math.random() * Math.PI * 2;

    orbitaRamos.push({
      el,
      angulo,
      radio,
      altura,
      velocidad,
      offset,
      fase: Math.random() * Math.PI * 2
    });

    universe.appendChild(el);
  });
}

// --- Mensajes flotantes ---
let orbitaMensajes = [];
function crearMensajes() {
  const radioBase = 700;
  mensajes.forEach((texto, i) => {
    const el = document.createElement('div');
    el.className = 'msg';
    el.textContent = texto;

    const angulo = (i / mensajes.length) * Math.PI * 2;
    const radio  = radioBase + (i % 4) * 90;
    const altura = (i % 6 - 3) * 110;
    const velocidad = 0.04 + Math.random() * 0.04;
    const offset = Math.random() * Math.PI * 2;

    orbitaMensajes.push({
      el,
      angulo,
      radio,
      altura,
      velocidad,
      offset,
      fase: Math.random() * Math.PI * 2
    });

    universe.appendChild(el);
  });
}

/* =========================================================
   4. ANIMACIÓN DE LA GALAXIA
   ========================================================= */
let rotX = -20, rotY = 0, zoom = 0.5;
let targetRotX = -20, targetRotY = 0, targetZoom = 0.5;
let time = 0;

function animar(t) {
  time += 0.016;

  // Auto-rotación suave
  targetRotY += 0.08;

  // Suavizado (lerp)
  rotX  += (targetRotX - rotX) * 0.08;
  rotY  += (targetRotY - rotY) * 0.08;
  zoom  += (targetZoom - zoom) * 0.08;

  // Aplicar transformación al universo
  universe.style.transform =
    `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${zoom})`;

  // Actualizar posición de ramos
  orbitaRamos.forEach(o => {
    const a = o.angulo + time * o.velocidad + o.offset;
    const x = Math.cos(a) * o.radio;
    const z = Math.sin(a) * o.radio;
    const y = o.altura + Math.sin(time * 1.5 + o.fase) * 20;
    o.el.style.transform =
      `translate3d(${x}px, ${y}px, ${z}px) scale(${1 + Math.sin(time + o.fase) * 0.15})`;
  });

  // Actualizar posición de mensajes
  orbitaMensajes.forEach(o => {
    const a = o.angulo + time * o.velocidad + o.offset;
    const x = Math.cos(a) * o.radio;
    const z = Math.sin(a) * o.radio;
    const y = o.altura + Math.sin(time * 1.2 + o.fase) * 25;
    o.el.style.transform =
      `translate3d(${x}px, ${y}px, ${z}px)`;
    // Opacidad según profundidad (efecto 3D)
    const op = 0.5 + (z / o.radio) * 0.5;
    o.el.style.opacity = Math.max(0.15, op);
  });

  requestAnimationFrame(animar);
}

/* =========================================================
   5. INTERACCIÓN: ARRASTRAR, ZOOM, DOBLE CLIC
   ========================================================= */
let dragging = false, lastX = 0, lastY = 0;

document.addEventListener('mousedown', e => {
  if (!scene.classList.contains('visible')) return;
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  document.body.classList.add('dragging');
});
document.addEventListener('mouseup', () => {
  dragging = false;
  document.body.classList.remove('dragging');
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  targetRotY += dx * 0.4;
  targetRotX -= dy * 0.4;
  targetRotX = Math.max(-80, Math.min(80, targetRotX));
  lastX = e.clientX; lastY = e.clientY;
});

// Zoom con la rueda
document.addEventListener('wheel', e => {
  if (!scene.classList.contains('visible')) return;
  e.preventDefault();
  targetZoom += e.deltaY * -0.001;
  targetZoom = Math.max(0.15, Math.min(2.5, targetZoom));
}, { passive: false });

// Doble clic para restablecer
document.addEventListener('dblclick', () => {
  targetRotX = -20; targetRotY = 0; targetZoom = 0.5;
});

// Táctil
let touchStart = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
document.addEventListener('touchmove', e => {
  if (!scene.classList.contains('visible')) return;
  if (e.touches.length === 1 && touchStart) {
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    targetRotY += dx * 0.4;
    targetRotX -= dy * 0.4;
    targetRotX = Math.max(-80, Math.min(80, targetRotX));
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});

/* =========================================================
   6. YOUTUBE API + INICIO
   ========================================================= */
let player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytPlayer', {
    height: '1',
    width:  '1',
    videoId: YOUTUBE_VIDEO_ID,
    playerVars: {
      autoplay: 0,
      controls: 0,
      loop: 1,
      playlist: YOUTUBE_VIDEO_ID,
      modestbranding: 1,
      rel: 0
    },
    events: {
      onReady: () => console.log('🎵 Reproductor listo')
    }
  });
}

// Cargar la API de YouTube
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

// Iniciar al hacer clic en el girasol
const sunflower = document.getElementById('sunflower');
const flowerScreen = document.getElementById('flowerScreen');

sunflower.addEventListener('click', () => {
  // 1. Animación de explosión de la flor
  sunflower.classList.add('clicked');

  // 2. Reproducir música (con pequeño delay para el gesto del usuario)
  setTimeout(() => {
    if (player && player.playVideo) {
      player.playVideo();
      player.setVolume(70);
    }
  }, 100);

  // 3. Ocultar pantalla de la flor y mostrar la galaxia
  setTimeout(() => {
    flowerScreen.classList.add('hidden');
    scene.classList.add('visible');

    // Inicializar la galaxia
    crearEstrellas();
    crearRamos();
    crearMensajes();

    // Zoom inicial animado
    targetZoom = 0.85;
    setTimeout(() => { targetZoom = 0.5; }, 1500);

    // Iniciar bucle de animación
    requestAnimationFrame(animar);
  }, 900);
});

// Permitir clic en cualquier parte del girasol (por si acaso)
flowerScreen.addEventListener('click', (e) => {
  if (e.target === flowerScreen) {
    sunflower.click();
  }
});
</script>
</body>
</html>
